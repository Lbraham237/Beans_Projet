name: CI

# Bonus CI/CD (/2) : lance les tests unitaires à chaque push / pull request.
# Les tests ne nécessitent pas TensorFlow, donc la CI reste rapide et légère.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances de test
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scikit-learn matplotlib pytest

      - name: Lancer les tests
        run: pytest -q tests/